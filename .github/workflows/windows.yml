name: Build Windows app

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          architecture: x64
          cache: pip
          cache-dependency-path: requirements-build.txt
      - name: Install pinned build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Prepare Windows video encoder tests
        shell: powershell
        run: |
          $mediaFeature = Get-WindowsFeature -Name Server-Media-Foundation
          if (-not $mediaFeature.Installed) {
            $mediaInstall = Install-WindowsFeature -Name Server-Media-Foundation -ErrorAction Stop
            if (-not $mediaInstall.Success) {
              throw "Windows Media Foundation could not be enabled for the MP4 encoder test."
            }
            if ($mediaInstall.RestartNeeded -eq "Yes") {
              throw "The runner requires a restart after enabling Media Foundation. Use a runner with this feature preinstalled."
            }
          }
      - name: Test, build and verify Dolly.exe
        run: python tools/build_windows.py
      - name: Downloadable release files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: Deadlock-Dolly-Windows-x64
          path: dist/*
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Build diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: Windows-build-diagnostics
          path: build/checks/
          if-no-files-found: ignore
          retention-days: 7
