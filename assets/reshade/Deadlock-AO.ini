; Deadlock Dolly - Ambient Occlusion preset (ReShade 6.8 add-on build)
; Requires the free iMMERSE pack: github.com/martymcmodding/iMMERSE
;   martysmods < Shaders > MartysMods_LAUNCHPAD.fx, MartysMods_MXAO.fx
;   (plus the .\MartysMods\*.fxh headers and the iMMERSE textures)
;
; Load order: Launchpad -> MXAO. Launchpad supplies smoothed normals that MXAO
; consumes via MXAO_USE_LAUNCHPAD_NORMALS. Leave it at the top of the sort list.
;
; Before this looks right, configure the depth buffer. Open the in-game overlay,
; add DisplayDepth.fx, and confirm the four RESHADE_DEPTH_* values below. The
; values here are a starting point for Deadlock's DirectX 11 renderer.
;
; Quality/perf knobs:
;   MXAO_GLOBAL_SAMPLE_QUALITY_PRESET 0..6 (Low..IDGAF)
;   SHADING_RATE 0=Full, 1=Half, 2=Quarter
;   MXAO_AO_TYPE 0=GTAO, 1=Solid Angle, 2=Visibility Bitmask (DX11+), 3=VB + Solid Angle
;   MXAO_USE_LAUNCHPAD_NORMALS 0 = compute normals in MXAO (faster), 1 = use Launchpad (cleaner)
;
; Only the two AO passes are enabled. Sharpen, SMAA and DOF are listed in
; TechniqueSorting so they appear in the menu already loaded, but they are not
; in Techniques, so they start OFF. Move a name into Techniques to turn it on.

PreprocessorDefinitions=RESHADE_DEPTH_INPUT_IS_REVERSED=1,RESHADE_DEPTH_INPUT_IS_LOGARITHMIC=0,RESHADE_DEPTH_INPUT_IS_UPSIDE_DOWN=0,RESHADE_DEPTH_LINEARIZATION_FAR_PLANE=1000.0
Techniques=MartysMods_Launchpad@MartysMods_LAUNCHPAD.fx,MartysMods_MXAO@MartysMods_MXAO.fx
TechniqueSorting=MartysMods_Launchpad@MartysMods_LAUNCHPAD.fx,MartysMods_MXAO@MartysMods_MXAO.fx,MartyMods_Sharpen@MartysMods_SHARPEN.fx,MartysMods_AntiAliasing@MartysMods_SMAA.fx,ADOF@qUINT_dof.fx

[MartysMods_LAUNCHPAD.fx]
OPTICAL_FLOW_Q=0
NORMALS_MODE=2
TEXTURED_NORMALS_QUALITY_ENUM=2
TEXTURED_NORMALS_RADIUS=0.5
TEXTURED_NORMALS_INTENSITY=0.5

[MartysMods_MXAO.fx]
PreprocessorDefinitions=MXAO_AO_TYPE=2,MXAO_USE_LAUNCHPAD_NORMALS=1
MXAO_GLOBAL_SAMPLE_QUALITY_PRESET=2
SHADING_RATE=1
MXAO_SAMPLE_RADIUS=2.5
MXAO_WORLDSPACE_ENABLE=0
MXAO_SSAO_AMOUNT=0.8
MXAO_FADE_DEPTH=0.25
MXAO_FILTER_SIZE=1
MXAO_DEBUG_VIEW_ENABLE=0
