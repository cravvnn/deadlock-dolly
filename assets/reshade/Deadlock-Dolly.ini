; Deadlock Dolly basic preset. All listed effects ship with Dolly.
; Color controls start neutral; enable other effects from the ReShade menu.
; DisplayDepth is available for checking depth, but starts disabled.
; Dolly binds the game's verified scene depth to DEPTH. Deadlock uses a
; reversed projection, so these defaults linearize it for depth effects.
PreprocessorDefinitions=RESHADE_DEPTH_INPUT_IS_REVERSED=1,RESHADE_DEPTH_INPUT_IS_LOGARITHMIC=0,RESHADE_DEPTH_INPUT_IS_UPSIDE_DOWN=0,RESHADE_DEPTH_INPUT_IS_MIRRORED=0,RESHADE_DEPTH_LINEARIZATION_FAR_PLANE=1000.0
Techniques=prod80_04_ContrastBrightnessSaturation@PD80_04_Contrast_Brightness_Saturation.fx
TechniqueSorting=prod80_04_ContrastBrightnessSaturation@PD80_04_Contrast_Brightness_Saturation.fx,prod80_05_LumaSharpen@PD80_05_Sharpening.fx,Deband@Deband.fx,LUT@LUT.fx,DisplayDepth@DisplayDepth.fx

[PD80_04_Contrast_Brightness_Saturation.fx]
enable_dither=0
tint=0.000000
exposureN=0.000000
contrast=0.000000
brightness=0.000000
